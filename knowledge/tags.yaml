# knowledge/tags.yaml
# Topic tag vocabulary for chunk metadata.
# Add, remove or rename tags here as your document set grows.
# Each tag should be a single lowercase word or words joined by underscores.
# Jurisdiction-specific tags should be reflected in the ChunkMetadata.jurisdiction field
# rather than in the tag name (e.g. use jurisdiction: Wales rather than tag: wales_specific).
#
# NOTE: Welsh law differs from English law in several important areas —
# the Renting Homes (Wales) Act 2016 replaced the assured tenancy regime for
# social housing in Wales. Tag documents correctly so retrieval can filter by
# jurisdiction when that distinction matters.

